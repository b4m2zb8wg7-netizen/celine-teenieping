<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Celine's Teenieping Land</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* ---------- Theme ---------- */
  :root{
    --sky1:#ffe3f1; --sky2:#e6d8ff; --sky3:#d4ecff;
    --pink:#ff6fae; --pink-dark:#e84d93;
    --purple:#9c6fd0; --yellow:#ffd95e;
    --text:#7a3f63;
    --card:#ffffff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent;
     -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
     touch-action:manipulation; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body{
    font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",-apple-system,sans-serif;
    background:linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
    color:var(--text);
    position:fixed; inset:0;
  }

  /* floating background sparkles */
  .bg-spark{ position:fixed; font-size:4vmin; opacity:.5; pointer-events:none;
    animation:floaty 6s ease-in-out infinite; z-index:0; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-3vmin) } }

  /* ---------- Screens ---------- */
  .screen{ position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; padding:max(2vmin, env(safe-area-inset-top)) 2vmin 2vmin;
    z-index:1; }
  .screen.show{ display:flex; }

  /* ---------- Title ---------- */
  #s-title h1{
    font-size:9vmin; margin:0 0 1vmin; text-align:center; color:var(--pink-dark);
    text-shadow:0 .8vmin 0 #ffffffaa; letter-spacing:.2vmin;
  }
  #s-title .subtitle{ font-size:4.5vmin; margin-bottom:3vmin; color:var(--purple); }
  .ping-parade{ display:flex; gap:2vmin; margin-bottom:4vmin; flex-wrap:wrap;
    justify-content:center; max-width:94vw; }
  .ping-parade .ping{ width:16vmin; height:16vmin; animation:bounce 1.4s ease-in-out infinite; }
  .ping-parade .ping:nth-child(2){ animation-delay:.15s }
  .ping-parade .ping:nth-child(3){ animation-delay:.3s }
  .ping-parade .ping:nth-child(4){ animation-delay:.45s }
  .ping-parade .ping:nth-child(5){ animation-delay:.6s }
  .ping-parade .ping:nth-child(6){ animation-delay:.75s }
  @keyframes bounce{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-3vmin) } }

  .big-btn{
    border:none; cursor:pointer; font-family:inherit;
    background:linear-gradient(180deg,#ff8ec0,var(--pink));
    color:#fff; font-size:7vmin; padding:3.5vmin 10vmin; border-radius:100vmin;
    box-shadow:0 1.5vmin 0 var(--pink-dark), 0 2.5vmin 3vmin #e84d9355;
    display:flex; align-items:center; gap:2.5vmin;
  }
  .big-btn:active{ transform:translateY(1vmin); box-shadow:0 .5vmin 0 var(--pink-dark); }

  /* ---------- Hub ---------- */
  #s-hub h2{ font-size:6vmin; margin:0 0 3vmin; color:var(--pink-dark); text-align:center; }
  .hub-grid{
    display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
    gap:3vmin; width:min(92vmin, 94vw);
  }
  .hub-card{
    background:var(--card); border:none; border-radius:5vmin; cursor:pointer;
    padding:2.5vmin; display:flex; flex-direction:column; align-items:center; gap:1vmin;
    box-shadow:0 1.2vmin 0 #e8c8de, 0 2vmin 3vmin #c79ab455;
    font-family:inherit;
  }
  .hub-card:active{ transform:scale(.95); }
  .hub-card .ping{ width:18vmin; height:18vmin; }
  .hub-card .icon{ font-size:7vmin; line-height:1; }
  .hub-card .label{ font-size:3.4vmin; color:var(--purple); font-weight:bold; }

  /* ---------- Game chrome ---------- */
  .topbar{
    position:absolute; top:max(1.5vmin, env(safe-area-inset-top)); left:0; right:0;
    display:flex; justify-content:space-between; padding:0 2vmin; z-index:5;
  }
  .round-btn{
    width:11vmin; height:11vmin; border-radius:50%; border:none; cursor:pointer;
    background:#fff; font-size:5.5vmin; display:flex; align-items:center; justify-content:center;
    box-shadow:0 .8vmin 0 #e8c8de;
  }
  .round-btn:active{ transform:scale(.9); }

  .stars{ display:flex; gap:1.5vmin; margin-bottom:2vmin; }
  .stars svg{ width:7vmin; height:7vmin; }

  .hearts{ display:flex; gap:1vmin; margin-bottom:1vmin; flex-wrap:wrap; justify-content:center; }
  .hearts svg{ width:5.5vmin; height:5.5vmin; }

  /* ---------- Catch game ---------- */
  #catch-arena{ position:relative; width:100%; flex:1; }
  .floater{
    position:absolute; width:17vmin; height:17vmin; cursor:pointer;
    transition:left 2.6s ease-in-out, top 2.6s ease-in-out;
    animation:wiggle 2s ease-in-out infinite;
  }
  @keyframes wiggle{ 0%,100%{ rotate:-6deg } 50%{ rotate:6deg } }
  .pop-spark{
    position:absolute; font-size:9vmin; pointer-events:none; z-index:6;
    animation:popspark .7s ease-out forwards;
  }
  @keyframes popspark{
    0%{ transform:scale(.3); opacity:1 }
    100%{ transform:scale(2.2); opacity:0 }
  }

  /* ---------- Colors / shapes rows ---------- */
  .prompt-ping{ width:24vmin; height:24vmin; margin-bottom:2vmin; }
  .choice-row{ display:flex; gap:4vmin; justify-content:center; flex-wrap:wrap; }
  .choice{
    background:var(--card); border:none; border-radius:5vmin; cursor:pointer; padding:2vmin;
    box-shadow:0 1.2vmin 0 #e8c8de;
  }
  .choice:active{ transform:scale(.93); }
  .choice .ping, .choice svg.shape{ width:24vmin; height:24vmin; display:block; }

  /* ---------- Counting ---------- */
  #count-arena{ position:relative; width:min(96vw,100vmin); flex:1; max-height:52vh; }
  .countable{ position:absolute; width:13vmin; height:13vmin; cursor:pointer;
    transform:translate(-50%,-50%); }
  .countable.counted{ filter:drop-shadow(0 0 2vmin gold); }
  .countable .tick{
    position:absolute; top:-1vmin; right:-1vmin; font-size:6vmin; display:none;
  }
  .countable.counted .tick{ display:block; }
  .num-row{ display:flex; flex-wrap:wrap; gap:2vmin; justify-content:center;
    padding-bottom:1vmin; max-width:96vw; }
  .num-btn{
    width:12.5vmin; height:12.5vmin; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(180deg,#c0a4ec,var(--purple)); color:#fff;
    font-family:inherit; font-size:5.5vmin; font-weight:bold;
    box-shadow:0 1vmin 0 #7b4fb0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; line-height:1;
  }
  .num-btn:active{ transform:translateY(.8vmin); box-shadow:0 .2vmin 0 #7b4fb0; }
  .num-btn .dots{ font-size:1.6vmin; letter-spacing:.25vmin; margin-top:.5vmin; line-height:1.3; }

  /* ---------- Letters ---------- */
  .abc-progress{ display:flex; flex-wrap:wrap; gap:.7vmin; justify-content:center;
    max-width:94vw; margin-bottom:3vmin; }
  .abc-cell{ width:4.6vmin; height:4.6vmin; border-radius:1.1vmin; background:#fff;
    color:#dbb9cf; font-size:2.8vmin; font-weight:bold;
    display:flex; align-items:center; justify-content:center; }
  .abc-cell.done{ background:var(--pink); color:#fff; }
  .letter-choice{ width:19vmin; height:19vmin; display:flex; align-items:center;
    justify-content:center; font-size:11vmin; font-weight:bold; font-family:inherit; }
  #shapes-row .choice svg.shape{ width:18vmin; height:18vmin; }

  /* fun feedback animations */
  .happy{ animation:happy .6s ease; }
  @keyframes happy{ 0%{transform:scale(1)} 40%{transform:scale(1.25) rotate(6deg)} 100%{transform:scale(1)} }
  .wobble{ animation:wobble .5s ease; }
  @keyframes wobble{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2vmin)} 75%{transform:translateX(2vmin)} }

  /* ---------- Win overlay ---------- */
  #overlay-win{
    position:absolute; inset:0; z-index:20; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:#ffd9ecf2;
  }
  #overlay-win.show{ display:flex; }
  #overlay-win .trophy{ font-size:16vmin; animation:bounce 1.2s ease-in-out infinite; }
  #overlay-win .winstars{ display:flex; gap:2vmin; margin:2vmin 0 4vmin; }
  #overlay-win .winstars svg{ width:13vmin; height:13vmin; animation:happy .9s ease infinite alternate; }
  #overlay-win .winstars svg:nth-child(2){ animation-delay:.2s }
  #overlay-win .winstars svg:nth-child(3){ animation-delay:.4s }
  .win-btns{ display:flex; gap:5vmin; }
  .win-btn{
    width:20vmin; height:20vmin; border-radius:50%; border:none; cursor:pointer;
    font-size:9vmin; background:#fff; box-shadow:0 1.2vmin 0 #e8a4c8;
    display:flex; align-items:center; justify-content:center;
  }
  .win-btn:active{ transform:scale(.92); }

  /* confetti */
  .confetto{
    position:fixed; top:-6vmin; z-index:30; pointer-events:none; font-size:4vmin;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1 }
    100%{ transform:translateY(110vh) rotate(540deg); opacity:.8 }
  }
</style>
</head>
<body>

<!-- decorative background sparkles -->
<div class="bg-spark" style="left:8%;  top:12%">✨</div>
<div class="bg-spark" style="left:85%; top:8%;  animation-delay:1s">⭐</div>
<div class="bg-spark" style="left:15%; top:80%; animation-delay:2s">💖</div>
<div class="bg-spark" style="left:90%; top:70%; animation-delay:3s">✨</div>
<div class="bg-spark" style="left:50%; top:5%;  animation-delay:1.5s">🌈</div>

<!-- ============ TITLE ============ -->
<div class="screen show" id="s-title">
  <h1>Celine's Teenieping Land</h1>
  <div class="subtitle">💖 Catch! Teenieping 💖</div>
  <div class="ping-parade" id="title-parade"></div>
  <button class="big-btn" id="btn-start">▶&nbsp; PLAY</button>
</div>

<!-- ============ HUB ============ -->
<div class="screen" id="s-hub">
  <h2>Pick a game! 💕</h2>
  <div class="hub-grid">
    <button class="hub-card" data-game="catch">
      <span class="icon">✨🖐️</span><span class="ping" data-ping="0"></span>
      <span class="label">Catch!</span>
    </button>
    <button class="hub-card" data-game="alpha">
      <span class="icon">🔤</span><span class="ping" data-ping="2"></span>
      <span class="label">Letters</span>
    </button>
    <button class="hub-card" data-game="count">
      <span class="icon">1️⃣2️⃣3️⃣</span><span class="ping" data-ping="1"></span>
      <span class="label">Counting</span>
    </button>
    <button class="hub-card" data-game="shapes">
      <span class="icon">💛⭐</span><span class="ping" data-ping="4"></span>
      <span class="label">Shapes</span>
    </button>
  </div>
</div>

<!-- ============ CATCH ============ -->
<div class="screen" id="s-catch">
  <div class="topbar">
    <button class="round-btn btn-home">🏠</button>
    <button class="round-btn btn-say">🔊</button>
  </div>
  <div style="height:12vmin"></div>
  <div class="hearts" id="catch-hearts"></div>
  <div id="catch-arena"></div>
</div>

<!-- ============ LETTERS ============ -->
<div class="screen" id="s-alpha">
  <div class="topbar">
    <button class="round-btn btn-home">🏠</button>
    <button class="round-btn btn-say">🔊</button>
  </div>
  <div class="abc-progress" id="abc-progress"></div>
  <div class="choice-row" id="alpha-row"></div>
</div>

<!-- ============ COUNTING ============ -->
<div class="screen" id="s-count">
  <div class="topbar">
    <button class="round-btn btn-home">🏠</button>
    <button class="round-btn btn-say">🔊</button>
  </div>
  <div class="stars" id="count-stars"></div>
  <div id="count-arena"></div>
  <div class="num-row" id="num-row"></div>
</div>

<!-- ============ SHAPES ============ -->
<div class="screen" id="s-shapes">
  <div class="topbar">
    <button class="round-btn btn-home">🏠</button>
    <button class="round-btn btn-say">🔊</button>
  </div>
  <div class="stars" id="shapes-stars"></div>
  <div class="ping prompt-ping" id="shapes-ping"></div>
  <div class="choice-row" id="shapes-row"></div>
</div>

<!-- ============ WIN ============ -->
<div id="overlay-win">
  <div class="trophy">🏆</div>
  <div class="winstars">
    <svg viewBox="0 0 100 100"><polygon points="50,4 61,36 95,36 67,57 77,90 50,70 23,90 33,57 5,36 39,36" fill="#ffc93c" stroke="#f5a623" stroke-width="3"/></svg>
    <svg viewBox="0 0 100 100"><polygon points="50,4 61,36 95,36 67,57 77,90 50,70 23,90 33,57 5,36 39,36" fill="#ffc93c" stroke="#f5a623" stroke-width="3"/></svg>
    <svg viewBox="0 0 100 100"><polygon points="50,4 61,36 95,36 67,57 77,90 50,70 23,90 33,57 5,36 39,36" fill="#ffc93c" stroke="#f5a623" stroke-width="3"/></svg>
  </div>
  <div class="win-btns">
    <button class="win-btn" id="btn-replay">🔁</button>
    <button class="win-btn" id="btn-winhome">🏠</button>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* =====================================================
   TEENIEPING CHARACTERS — drawn as inline SVG
   ===================================================== */
const PINGS = [
  { name:'Heartsping',  color:'pink',   body:'#ffa1c9', dark:'#f06ba8', emblem:'heart',  emColor:'#ff3d7f' },
  { name:'Joyping',     color:'yellow', body:'#ffd95e', dark:'#f0ad2d', emblem:'star',   emColor:'#ff9800' },
  { name:'Lalaping',    color:'purple', body:'#c5a3e8', dark:'#9c6fd0', emblem:'note',   emColor:'#7b3fbf' },
  { name:'Aroming',     color:'orange', body:'#ffb27a', dark:'#f08a3e', emblem:'flower', emColor:'#ff6d2e' },
  { name:'Steadyping',  color:'green',  body:'#9fdd8e', dark:'#6cbf58', emblem:'clover', emColor:'#3c9e2f' },
  { name:'Flyping',     color:'blue',   body:'#90c8f8', dark:'#5a9be0', emblem:'cloud',  emColor:'#3d7fd6' },
];
const SHAPE_NAMES = { heart:'heart', star:'star', note:'music note', flower:'flower', clover:'lucky clover', cloud:'cloud',
                      circle:'circle', square:'square', triangle:'triangle', diamond:'diamond', moon:'moon' };
// shapes with no owner Teenieping (used by the shapes game for variety)
const EXTRA_SHAPES = ['circle','square','triangle','diamond','moon'];

function shapeInner(name, color){
  switch(name){
    case 'heart':
      return `<path d="M50 86 C22 64 8 46 8 30 C8 15 19 7 31 7 C40 7 47 12 50 20 C53 12 60 7 69 7 C81 7 92 15 92 30 C92 46 78 64 50 86Z" fill="${color}"/>`;
    case 'star':
      return `<polygon points="50,4 61,36 95,36 67,57 77,90 50,70 23,90 33,57 5,36 39,36" fill="${color}"/>`;
    case 'note':
      return `<ellipse cx="33" cy="77" rx="15" ry="12" fill="${color}"/>
              <rect x="42" y="12" width="8" height="66" rx="4" fill="${color}"/>
              <path d="M50 12 C68 18 76 29 73 44 C67 32 59 28 50 27 Z" fill="${color}"/>`;
    case 'flower':
      return `<circle cx="50" cy="29" r="15" fill="${color}"/><circle cx="70" cy="43.5" r="15" fill="${color}"/>
              <circle cx="62.3" cy="67" r="15" fill="${color}"/><circle cx="37.7" cy="67" r="15" fill="${color}"/>
              <circle cx="30" cy="43.5" r="15" fill="${color}"/><circle cx="50" cy="50" r="11" fill="#ffd95e"/>`;
    case 'clover':
      return `<circle cx="35" cy="35" r="17" fill="${color}"/><circle cx="65" cy="35" r="17" fill="${color}"/>
              <circle cx="35" cy="65" r="17" fill="${color}"/><circle cx="65" cy="65" r="17" fill="${color}"/>
              <path d="M50 66 C52 78 56 86 63 93" stroke="${color}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    case 'cloud':
      return `<ellipse cx="50" cy="62" rx="34" ry="20" fill="${color}"/>
              <circle cx="36" cy="48" r="16" fill="${color}"/><circle cx="58" cy="42" r="20" fill="${color}"/>`;
    case 'circle':
      return `<circle cx="50" cy="50" r="40" fill="${color}"/>`;
    case 'square':
      return `<rect x="12" y="12" width="76" height="76" rx="10" fill="${color}"/>`;
    case 'triangle':
      return `<polygon points="50,10 92,86 8,86" fill="${color}"/>`;
    case 'diamond':
      return `<polygon points="50,6 90,50 50,94 10,50" fill="${color}"/>`;
    case 'moon':
      return `<path d="M63 8 A44 44 0 1 0 63 92 A35 35 0 1 1 63 8 Z" fill="${color}"/>`;
  }
  return '';
}
function shapeSVG(name, color){
  return `<svg class="shape" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${shapeInner(name,color)}</svg>`;
}
function pingSVG(p){
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
    <circle cx="28" cy="22" r="13" fill="${p.dark}"/>
    <circle cx="72" cy="22" r="13" fill="${p.dark}"/>
    <circle cx="28" cy="22" r="7"  fill="${p.body}"/>
    <circle cx="72" cy="22" r="7"  fill="${p.body}"/>
    <circle cx="50" cy="58" r="38" fill="${p.body}" stroke="${p.dark}" stroke-width="2.5"/>
    <g transform="translate(50,33) scale(0.22) translate(-50,-50)">${shapeInner(p.emblem, p.emColor)}</g>
    <circle cx="37" cy="56" r="6.5" fill="#3a2434"/><circle cx="39.5" cy="53.5" r="2.4" fill="#fff"/>
    <circle cx="63" cy="56" r="6.5" fill="#3a2434"/><circle cx="65.5" cy="53.5" r="2.4" fill="#fff"/>
    <path d="M42 70 Q50 78 58 70" stroke="${p.dark}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="29" cy="66" rx="5.5" ry="3.8" fill="#ff9ec3" opacity=".75"/>
    <ellipse cx="71" cy="66" rx="5.5" ry="3.8" fill="#ff9ec3" opacity=".75"/>
  </svg>`;
}

/* =====================================================
   VOICE — pre-recorded clips in voice/*.mp3, played through
   Web Audio (the same system as the sound effects, which is
   reliable on iPad). The built-in speech engine is only a
   backup if a clip can't load. Regenerate clips by editing
   gen_voice.py to match VOICE_LINES, then running it.
   ===================================================== */
const VOICE_LINES = (() => {
  const v = {
    'welcome':     "Hi Celine! Welcome to Teenieping Land! Pick a game! Tap a picture!",
    'hub':         "Pick a game, Celine! Tap a picture!",
    'catch-intro': "Oh no! The Teeniepings are floating away! Catch them, Celine! Tap the Teeniepings!",
    'now-number':  "Now tap the big number!",
    'count-q':     "How many Teeniepings can you see? Tap each Teenieping to count them. Then tap the big number!",
    'count-no':    "Hmm, let's count again! Tap each Teenieping!",
    'praise-1':    "Hooray! You did it, Celine! You are amazing!",
    'praise-2':    "Woohoo! Great job, Celine! The Teeniepings are so happy!",
    'praise-3':    "Yay Celine! You are a Teenieping superstar!",
    'alpha-intro': "Let's find all the letters, from A to Z!",
    'oops-letter': "Oopsie! Try again!",
  };
  const words = ['one','two','three','four','five','six','seven','eight','nine','ten'];
  words.forEach((w, i) => v['num-' + (i+1)] = w[0].toUpperCase() + w.slice(1) + '!');
  for(let n = 1; n <= 10; n++){
    v['count-yes-' + n] = 'Yes! ' + words[n-1][0].toUpperCase() + words[n-1].slice(1) +
      (n === 1 ? ' Teenieping!' : ' Teeniepings!') + ' Well done, Celine!';
  }
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch => {
    v['alpha-q-' + ch.toLowerCase()] = `Can you find the letter ${ch}? Tap the letter ${ch}!`;
    v['letter-' + ch.toLowerCase()]  = `The letter ${ch}!`;
  });
  ['Yay!','Well done!','Great job!','Amazing!'].forEach((c, i) => v['cheer-' + (i+1)] = c);
  EXTRA_SHAPES.forEach(s => {
    const sw = SHAPE_NAMES[s];
    v['shape-q-' + s]    = `The Teeniepings are looking for the ${sw}! Can you find it, Celine? Tap the ${sw}!`;
    v['shape-yes-' + s]  = `Yay! You found the ${sw}! The Teeniepings are so happy!`;
    v['shape-no-' + s]   = `Oopsie, that's the ${sw}!`;
    v['shape-find-' + s] = `Find the ${sw}!`;
  });
  PINGS.forEach(p => {
    const sw = SHAPE_NAMES[p.emblem];
    v['color-q-' + p.color]     = `Where is the ${p.color} Teenieping? Tap the ${p.color} one!`;
    v['color-yes-' + p.color]   = `Yay! That's ${p.color}! That's ${p.name}!`;
    v['color-no-' + p.color]    = `Oopsie! That one is ${p.color}.`;
    v['shape-q-' + p.emblem]    = `${p.name} lost her ${sw}! Can you find it, Celine? Tap the ${sw}!`;
    v['shape-yes-' + p.emblem]  = `Yay! You found the ${sw}! ${p.name} is so happy!`;
    v['shape-no-' + p.emblem]   = `Oopsie, that's the ${sw}!`;
    v['shape-find-' + p.emblem] = `Find the ${sw}!`;
  });
  return v;
})();

const clipCache = {};
function loadClip(key){
  if(!clipCache[key]){
    clipCache[key] = fetch('voice/' + key + '.mp3')
      .then(r => { if(!r.ok) throw new Error('missing clip'); return r.arrayBuffer(); })
      .then(buf => audio().decodeAudioData(buf));
    clipCache[key].catch(() => {});   // handled at play time
  }
  return clipCache[key];
}

let voiceSeq = 0, currentPromptKeys = [], liveSource = null;
// speak('hub') or speak(['num-3','now-number']) — clips play one after another
function speak(keys, remember = false){
  if(typeof keys === 'string') keys = [keys];
  if(remember) currentPromptKeys = keys;
  const my = ++voiceSeq;
  try{ if(liveSource) liveSource.stop(); }catch(e){}
  liveSource = null;
  try{ speechSynthesis.cancel(); }catch(e){}
  playFrom(keys, 0, my);
}
function playFrom(keys, i, my){
  if(my !== voiceSeq || i >= keys.length) return;
  loadClip(keys[i]).then(buf => {
    if(my !== voiceSeq) return;
    const a = audio(), src = a.createBufferSource();
    src.buffer = buf;
    src.connect(a.destination);
    liveSource = src;
    src.onended = () => { if(my === voiceSeq) playFrom(keys, i + 1, my); };
    src.start();
  }).catch(() => {
    if(my !== voiceSeq) return;
    ttsFallback(VOICE_LINES[keys[i]], () => { if(my === voiceSeq) playFrom(keys, i + 1, my); });
  });
}
let keepUtterance = null;   // iOS garbage-collects utterances that aren't referenced
function ttsFallback(text, done){
  if(!text) return done();
  let called = false;
  const next = () => { if(!called){ called = true; done(); } };
  try{
    const u = new SpeechSynthesisUtterance(text);
    keepUtterance = u;
    u.lang = 'en-AU'; u.rate = 0.92; u.pitch = 1.2;
    u.onend = next; u.onerror = next;
    speechSynthesis.speak(u);
  }catch(e){ next(); }
}

// iPads mute some page audio when the device is in Silent mode. Declaring a
// "playback" audio session tells iOS this page's audio is media, not a beep.
try{ if('audioSession' in navigator) navigator.audioSession.type = 'playback'; }catch(e){}

// start fetching every clip immediately so they're ready by the first tap
Object.keys(VOICE_LINES).forEach(loadClip);

/* =====================================================
   SOUND EFFECTS — tiny synth, no audio files needed
   ===================================================== */
let actx = null;
function audio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
function tone(freq, dur, type, when, vol, slideTo){
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + (when||0);
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(vol||0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
const sndPop  = () => tone(620, .18, 'sine', 0, .25, 160);
const sndDing = () => tone(880, .25, 'triangle', 0, .2);
const sndYay  = () => { [523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.11,.18)); };
const sndOops = () => { tone(330,.18,'sine',0,.12); tone(262,.22,'sine',.18,.12); };

/* =====================================================
   SCREENS + SHARED UI
   ===================================================== */
let currentGame = null;
let catchTimers = [];
// one shared timer for "what happens after this round" — cancelled by the
// home button so a finished game can't keep talking over the hub
let roundTimer = null;
function later(fn, ms){ clearTimeout(roundTimer); roundTimer = setTimeout(fn, ms); }

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  $(id).classList.add('show');
  $('overlay-win').classList.remove('show');
}
function stopCatchTimers(){ catchTimers.forEach(clearInterval); catchTimers = []; }
function goHome(){
  stopCatchTimers();
  clearTimeout(roundTimer);   // no queued next-round voice after leaving a game
  currentGame = null;
  showScreen('s-hub');
  speak('hub', true);         // speak() also cuts off whatever was playing
}
function starRow(el, total, filled){
  el.innerHTML = '';
  for(let i=0;i<total;i++){
    el.innerHTML += `<svg viewBox="0 0 100 100"><polygon points="50,4 61,36 95,36 67,57 77,90 50,70 23,90 33,57 5,36 39,36"
      fill="${i<filled ? '#ffc93c' : '#ffffff'}" stroke="#f5a623" stroke-width="4"/></svg>`;
  }
}
function confetti(){
  const stuff = ['💖','⭐','✨','💜','💛','🌸','🎀'];
  for(let i=0;i<55;i++){
    const c = document.createElement('div');
    c.className = 'confetto';
    c.textContent = stuff[Math.floor(Math.random()*stuff.length)];
    c.style.left = Math.random()*100 + 'vw';
    c.style.animationDuration = (2.2 + Math.random()*2.2) + 's';
    c.style.animationDelay = (Math.random()*0.8) + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5500);
  }
}
function win(){
  stopCatchTimers();
  $('overlay-win').classList.add('show');
  confetti(); sndYay();
  speak('praise-' + (1 + Math.floor(Math.random()*3)), true);
}

/* =====================================================
   GAME 1 — CATCH! (tap the floating Teeniepings, count to 10)
   ===================================================== */
const CATCH_GOAL = 10;
let caught = 0;

function heartsRow(){
  const el = $('catch-hearts'); el.innerHTML = '';
  for(let i=0;i<CATCH_GOAL;i++){
    el.innerHTML += `<svg viewBox="0 0 100 100">${shapeInner('heart', i<caught ? '#ff3d7f' : '#ffffff')}
      <path d="M50 86 C22 64 8 46 8 30 C8 15 19 7 31 7 C40 7 47 12 50 20 C53 12 60 7 69 7 C81 7 92 15 92 30 C92 46 78 64 50 86Z"
        fill="none" stroke="#f06ba8" stroke-width="5"/></svg>`;
  }
}
function randPos(el){
  el.style.left = (5 + Math.random()*72) + '%';
  el.style.top  = (2 + Math.random()*70) + '%';
}
function spawnFloater(){
  if(currentGame !== 'catch') return;   // player already went home
  const arena = $('catch-arena');
  const p = PINGS[Math.floor(Math.random()*PINGS.length)];
  const f = document.createElement('div');
  f.className = 'floater';
  f.innerHTML = pingSVG(p);
  randPos(f);
  arena.appendChild(f);
  const mover = setInterval(()=>randPos(f), 2600);
  catchTimers.push(mover);
  f.addEventListener('pointerdown', () => {
    clearInterval(mover);
    sndPop();
    caught++;
    speak('num-' + caught);
    // sparkle where the Teenieping was
    const s = document.createElement('div');
    s.className = 'pop-spark'; s.textContent = '✨';
    s.style.left = f.style.left; s.style.top = f.style.top;
    arena.appendChild(s);
    setTimeout(()=>s.remove(), 700);
    f.remove();
    heartsRow();
    if(caught >= CATCH_GOAL){ later(win, 700); }
    else { later(spawnFloater, 500); }
  }, { once:true });
}
function startCatch(){
  currentGame = 'catch';
  stopCatchTimers();
  caught = 0;
  $('catch-arena').innerHTML = '';
  heartsRow();
  showScreen('s-catch');
  speak('catch-intro', true);
  for(let i=0;i<4;i++) setTimeout(spawnFloater, i*350);
}

/* =====================================================
   GAME 2 — LETTERS (find all 26 letters, A to Z; a surprise
   Teenieping hides behind every correct letter)
   ===================================================== */
const ROUNDS = 5;
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const ABC_KEY = 'celineAbc';
// letters found so far — saved so Celine can continue another day
let abcFound = new Set(JSON.parse(localStorage.getItem(ABC_KEY) || '[]'));
let alphaBusy = false;

function shuffled(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function saveAbc(){ localStorage.setItem(ABC_KEY, JSON.stringify([...abcFound])); }

function abcRow(){
  const el = $('abc-progress'); el.innerHTML = '';
  // cells stay blank until that letter has been found, so the tracker
  // can't be used as a cheat sheet
  LETTERS.forEach(L => {
    const done = abcFound.has(L);
    el.innerHTML += `<div class="abc-cell${done ? ' done' : ''}">${done ? L : ''}</div>`;
  });
}
function nextAlphaRound(withIntro){
  alphaBusy = false;
  abcRow();
  const remaining = LETTERS.filter(L => !abcFound.has(L));
  const target = remaining[Math.floor(Math.random()*remaining.length)];
  const options = shuffled([target, ...shuffled(LETTERS.filter(l => l !== target)).slice(0,3)]);
  const row = $('alpha-row'); row.innerHTML = '';
  options.forEach(L => {
    const b = document.createElement('button');
    b.className = 'choice letter-choice';
    b.textContent = L;
    b.style.color = PINGS[Math.floor(Math.random()*PINGS.length)].dark;
    b.addEventListener('pointerdown', () => {
      if(alphaBusy) return;
      if(L === target){
        alphaBusy = true;
        // the letter turns into a surprise Teenieping!
        b.innerHTML = pingSVG(PINGS[Math.floor(Math.random()*PINGS.length)]);
        b.classList.add('happy'); sndYay();
        speak(['letter-' + target.toLowerCase(), 'cheer-' + (1 + Math.floor(Math.random()*4))]);
        abcFound.add(target); saveAbc();
        abcRow();
        later(() => {
          if(abcFound.size >= LETTERS.length){
            abcFound.clear(); saveAbc();   // alphabet complete — fresh start next time
            win();
          }else{
            nextAlphaRound(false);
          }
        }, 1700);
      }else{
        b.classList.add('wobble'); sndOops();
        setTimeout(() => b.classList.remove('wobble'), 600);
        speak(['oops-letter', 'alpha-q-' + target.toLowerCase()]);
      }
    });
    row.appendChild(b);
  });
  const q = 'alpha-q-' + target.toLowerCase();
  speak(withIntro ? ['alpha-intro', q] : [q], true);
}
function startAlpha(){
  currentGame = 'alpha';
  showScreen('s-alpha');
  nextAlphaRound(true);
}

/* =====================================================
   GAME 3 — COUNTING (count the Teeniepings, tap the number)
   ===================================================== */
let cntRound = 0, cntTarget = 0, cntTapped = 0, cntBusy = false;
// preset scatter spots (percent of arena) so Teeniepings never overlap
const SLOTS = [[12,16],[37,12],[62,16],[87,14],[12,46],[37,42],[63,46],[88,44],
               [13,78],[38,84],[63,78],[88,82]];

function nextCountRound(){
  cntBusy = false;
  starRow($('count-stars'), ROUNDS, cntRound);
  cntTarget = 1 + Math.floor(Math.random()*10);
  cntTapped = 0;
  const p = PINGS[Math.floor(Math.random()*PINGS.length)];
  const arena = $('count-arena'); arena.innerHTML = '';
  shuffled(SLOTS).slice(0, cntTarget).forEach(([x,y]) => {
    const d = document.createElement('div');
    d.className = 'countable';
    d.style.left = x+'%'; d.style.top = y+'%';
    d.innerHTML = pingSVG(p) + '<span class="tick">⭐</span>';
    d.addEventListener('pointerdown', () => {
      if(cntBusy || d.classList.contains('counted')) return;
      d.classList.add('counted','happy');
      sndDing();
      cntTapped++;
      if(cntTapped === cntTarget){
        speak(['num-' + cntTapped, 'now-number']);
      }else{
        speak('num-' + cntTapped);
      }
    });
    arena.appendChild(d);
  });
  const row = $('num-row'); row.innerHTML = '';
  for(let n=1;n<=10;n++){
    const b = document.createElement('button');
    b.className = 'num-btn';
    const dots = '●'.repeat(Math.min(n,5)) + (n > 5 ? '<br>' + '●'.repeat(n-5) : '');
    b.innerHTML = n + `<span class="dots">${dots}</span>`;
    b.addEventListener('pointerdown', () => {
      if(cntBusy) return;
      if(n === cntTarget){
        cntBusy = true;
        b.classList.add('happy'); sndYay();
        speak('count-yes-' + n);
        cntRound++;
        starRow($('count-stars'), ROUNDS, cntRound);
        later(() => cntRound >= ROUNDS ? win() : nextCountRound(), 2100);
      }else{
        b.classList.add('wobble'); sndOops();
        setTimeout(()=>b.classList.remove('wobble'), 600);
        speak('count-no');
        cntTapped = 0;
        document.querySelectorAll('.countable').forEach(c => c.classList.remove('counted'));
      }
    });
    row.appendChild(b);
  }
  speak('count-q', true);
}
function startCount(){
  currentGame = 'count';
  cntRound = 0;
  showScreen('s-count');
  nextCountRound();
}

/* =====================================================
   GAME 4 — SHAPES (find the spoken shape)
   ===================================================== */
let shpRound = 0, shpTarget = null, shpBusy = false, lastShape = null;
const ALL_SHAPES = [...PINGS.map(p => p.emblem), ...EXTRA_SHAPES];

function nextShapeRound(){
  shpBusy = false;
  starRow($('shapes-stars'), ROUNDS, shpRound);
  do{ shpTarget = ALL_SHAPES[Math.floor(Math.random()*ALL_SHAPES.length)]; }while(shpTarget === lastShape);
  lastShape = shpTarget;
  // emblem shapes belong to a Teenieping; the extra shapes get a random helper
  const owner = PINGS.find(p => p.emblem === shpTarget) || PINGS[Math.floor(Math.random()*PINGS.length)];
  $('shapes-ping').innerHTML = pingSVG(owner);
  const others = shuffled(ALL_SHAPES.filter(s => s !== shpTarget)).slice(0,3);
  const options = shuffled([shpTarget, ...others]);
  const row = $('shapes-row'); row.innerHTML = '';
  options.forEach(sh => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = shapeSVG(sh, owner.emColor);   // all same colour, so it's about SHAPE
    b.addEventListener('pointerdown', () => {
      if(shpBusy) return;
      if(sh === shpTarget){
        shpBusy = true;
        b.classList.add('happy'); sndYay();
        speak('shape-yes-' + sh);
        shpRound++;
        starRow($('shapes-stars'), ROUNDS, shpRound);
        later(() => shpRound >= ROUNDS ? win() : nextShapeRound(), 2100);
      }else{
        b.classList.add('wobble'); sndOops();
        setTimeout(()=>b.classList.remove('wobble'), 600);
        speak(['shape-no-' + sh, 'shape-find-' + shpTarget]);
      }
    });
    row.appendChild(b);
  });
  speak('shape-q-' + shpTarget, true);
}
function startShapes(){
  currentGame = 'shapes';
  shpRound = 0;
  showScreen('s-shapes');
  nextShapeRound();
}

/* =====================================================
   WIRING
   ===================================================== */
const GAME_STARTERS = { catch:startCatch, alpha:startAlpha, count:startCount, shapes:startShapes };

// title parade + hub card characters
$('title-parade').innerHTML = PINGS.map(p => `<span class="ping">${pingSVG(p)}</span>`).join('');
document.querySelectorAll('[data-ping]').forEach(el => {
  el.innerHTML = pingSVG(PINGS[+el.dataset.ping]);
});

$('btn-start').addEventListener('pointerdown', () => {
  audio();                       // unlock sound on first tap (iPad needs this)
  sndYay();
  showScreen('s-hub');
  speak('welcome', true);
});

document.querySelectorAll('.hub-card').forEach(card => {
  card.addEventListener('pointerdown', () => { sndDing(); GAME_STARTERS[card.dataset.game](); });
});
document.querySelectorAll('.btn-home').forEach(b => b.addEventListener('pointerdown', goHome));
document.querySelectorAll('.btn-say').forEach(b => b.addEventListener('pointerdown', () => speak(currentPromptKeys)));

$('btn-replay').addEventListener('pointerdown', () => { GAME_STARTERS[currentGame](); });
$('btn-winhome').addEventListener('pointerdown', goHome);

// stop iPad rubber-band scrolling
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
</script>
</body>
</html>
